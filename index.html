<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06121c">
  <meta name="description" content="Juego de preguntas de fútbol para 2 jugadores">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <title>Preguntas de Fútbol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Pantalla de inicio -->
  <section id="inicio" class="pantalla activa">
    <button class="btn-sonido flotante" aria-label="Activar o silenciar sonido">🔊</button>
    <div class="logo">
      <div class="logo-pelota">⚽</div>
      <h1><span>Preguntas de</span> Fútbol</h1>
    </div>
    <p class="sub">Duelo de 2 jugadores · En cada columna se empieza por <b>abajo</b> y se va subiendo</p>

    <!-- Elegir modo -->
    <div id="panelModo" class="panel activo">
      <button id="btnModoLocal" class="btn grande modo">🎮 Mismo dispositivo</button>
      <button id="btnModoOnline" class="btn grande modo">🌐 Jugar online</button>
    </div>

    <!-- Modo local -->
    <div id="panelLocal" class="panel">
      <div class="nombres">
        <label>Jugador 1 <input id="nombre1" maxlength="16" value="Jugador 1"></label>
        <label>Jugador 2 <input id="nombre2" maxlength="16" value="Jugador 2"></label>
      </div>
      <div class="slot-opciones"></div>
      <button id="btnEmpezar" class="btn grande">Empezar</button>
      <button class="btn secundario btn-volver">← Volver</button>
    </div>

    <!-- Online: crear o unirse -->
    <div id="panelOnline" class="panel">
      <div class="nombres">
        <label>Tu nombre <input id="miNombre" maxlength="16" placeholder="Tu nombre"></label>
      </div>
      <p id="msgInvitacion" class="aviso-inline oculto"></p>
      <button id="btnCrearSala" class="btn grande">Crear sala</button>
      <div class="separador">o unite a una sala</div>
      <div class="unirse">
        <input id="codigoSala" maxlength="5" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off">
        <button id="btnUnirse" class="btn">Unirse</button>
      </div>
      <p id="estadoOnline" class="estado-red"></p>
      <button class="btn secundario btn-volver">← Volver</button>
    </div>

    <!-- Online: sala del anfitrión -->
    <div id="panelSala" class="panel">
      <p>Código de la sala</p>
      <div id="codigoGrande" class="codigo-grande"></div>
      <button id="btnCompartir" class="btn">📤 Invitar</button>
      <p id="estadoSala" class="estado-red">Esperando rival...</p>
      <div class="slot-opciones"></div>
      <button id="btnEmpezarOnline" class="btn grande" disabled>Empezar</button>
      <button class="btn secundario btn-salir">✖ Cerrar sala</button>
    </div>

    <!-- Online: invitado esperando -->
    <div id="panelEspera" class="panel">
      <p id="estadoEspera" class="estado-red"></p>
      <div class="pelota-cargando">⚽</div>
      <button class="btn secundario btn-salir">✖ Salir</button>
    </div>

    <!-- Opciones de partida (se mueve al panel activo) -->
    <div id="opciones" class="opciones-juego">
      <label><input type="checkbox" id="optRebote" checked> Rebote: si uno falla, el rival puede responder</label>
      <label><input type="checkbox" id="optRestar"> Restar puntos al fallar</label>
      <label>Categorías por partida (se sortean)
        <select id="optCantidad">
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
        </select>
      </label>
      <label>Tiempo por pregunta
        <select id="optTiempo">
          <option value="0">Sin límite</option>
          <option value="15">15 s</option>
          <option value="30" selected>30 s</option>
          <option value="45">45 s</option>
        </select>
      </label>
    </div>
  </section>

  <!-- Tablero -->
  <section id="juego" class="pantalla">
    <header class="marcador">
      <div class="jugador" id="j0"><span class="avatar"></span><div class="datos"><span class="nombre"></span><span class="puntos">0</span></div></div>
      <div class="centro">
        <div class="turno" id="turno"></div>
        <button class="btn-sonido" aria-label="Activar o silenciar sonido">🔊</button>
      </div>
      <div class="jugador" id="j1"><span class="avatar"></span><div class="datos"><span class="nombre"></span><span class="puntos">0</span></div></div>
    </header>
    <div id="tablero" class="tablero"></div>
  </section>

  <!-- Pregunta -->
  <div id="modal" class="modal oculto">
    <div class="caja">
      <div class="cabecera">
        <span id="mCategoria"></span>
        <span id="mValor"></span>
      </div>
      <div id="mQuien" class="quien"></div>
      <div id="mTimer" class="timer"><div class="barra"></div></div>
      <h2 id="mPregunta"></h2>
      <div id="mOpciones" class="opciones"></div>
      <div id="mResultado" class="resultado"></div>
      <button id="btnContinuar" class="btn oculto">Continuar</button>
    </div>
  </div>

  <!-- Final -->
  <section id="final" class="pantalla">
    <canvas id="confeti"></canvas>
    <div class="trofeo">🏆</div>
    <h1 id="ganador"></h1>
    <p id="resumen" class="sub"></p>
    <p id="esperaRevancha" class="estado-red oculto">Esperando que el anfitrión arranque la revancha...</p>
    <button id="btnRevancha" class="btn grande">Revancha</button>
    <button id="btnNuevo" class="btn">Volver al inicio</button>
  </section>

  <!-- Aviso de desconexión -->
  <div id="aviso" class="modal oculto">
    <div class="caja centrada">
      <h2 id="avisoTexto"></h2>
      <button id="btnAvisoOk" class="btn">Volver al inicio</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="sonidos.js"></script>
  <script src="preguntas.js"></script>
  <script src="red.js"></script>
  <script src="juego.js"></script>
</body>
</html>
